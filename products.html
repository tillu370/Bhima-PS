<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products | Bhima Print Solutions</title>
  <meta name="description" content="Browse custom printing products from Bhima Print Solutions: business cards, apparel, gifts, packaging, stationery and signage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">

<body>
<main id="main">
<section class="page-hero"><div class="container">
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Products</span></nav>
  <h1>All Products</h1>
  <p>Everything you need to print, personalise and promote.</p>
</div></section>
<section class="page-section"><div class="container">
  <div class="catalog-bar">
    <div class="filter-pills" id="filterPills" role="group" aria-label="Filter products by category"></div>
    <select class="sort-select" id="sortSelect" aria-label="Sort products">
      <option value="order">Featured</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="name">Name A-Z</option>
      <option value="new">Newest</option>
    </select>
  </div>
  <p class="result-count" id="resultCount" aria-live="polite"></p>
  <div class="products-grid" id="productsGrid"></div>
  <div class="state-box" id="productsState" hidden></div>
</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.87.1/dist/umd/supabase.js"></script>

<script src="js/core.js?v=3"></script>
