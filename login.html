<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in or Sign up | Bhima Print Solutions</title>
  <meta name="description" content="Log in or create an account with Bhima Print Solutions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="polish.css?v=9">
  <link rel="stylesheet" href="vibe.css?v=17">
  <link rel="stylesheet" href="pages.css?v=1">
  <link rel="stylesheet" href="mobile.css?v=4">
</head>
<body>
<main id="main">
<section class="page-hero"><div class="container">
  
  <h1>Welcome</h1>
  <p>Log in to place orders, track them and save your favourites.</p>
</div></section>
<section class="page-section"><div class="container"><div class="auth-wrap">
  <div class="form-card">
    <div class="tabs" role="tablist" aria-label="Account" id="authTabs">
      <button type="button" role="tab" id="tabLogin" aria-selected="true" aria-controls="paneLogin">Log in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false" aria-controls="paneSignup">Sign up</button>
    </div>
    <p class="form-error" id="authError" role="alert" hidden></p>
    <p class="form-ok" id="authOk" role="status" hidden></p>

    <form id="paneLogin" role="tabpanel" aria-labelledby="tabLogin" novalidate>
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Log in</button>
      <p class="auth-alt"><button type="button" class="link-btn" id="forgotBtn">Forgot your password?</button></p>
    </form>

    <form id="paneSignup" role="tabpanel" aria-labelledby="tabSignup" hidden novalidate>
      <div class="field"><label for="suName">Full name</label><input id="suName" type="text" autocomplete="name" maxlength="100" required></div>
      <div class="field"><label for="suPhone">Phone</label><input id="suPhone" type="tel" autocomplete="tel" maxlength="20" required></div>
      <div class="field"><label for="suEmail">Email</label><input id="suEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="suPassword">Password</label><input id="suPassword" type="password" autocomplete="new-password" minlength="8" required><span class="hint">At least 8 characters.</span></div>
      <button class="btn btn-primary btn-block" type="submit" id="signupBtn">Create account</button>
    </form>

    <form id="paneReset" hidden novalidate>
      <h2>Set a new password</h2>
      <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn btn-primary btn-block" type="submit">Update password</button>
    </form>
  </div>
</div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.87.1/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/layout-html.js"></script>
<script src="js/core.js?v=3"></script>
<script src="js/login.js"></script>
</body>
</html>
